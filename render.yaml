services:
  - type: web
    name: cit-scheduling-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: CIT Scheduler
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./cit_scheduler.db
      - key: SOLVER_TIME_LIMIT_SECONDS
        value: "120"
      - key: SOLVER_NUM_WORKERS
        value: "8"
